name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.2
  NODE_VERSION: 24

jobs:
  check:
    name: Check and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Vite+ and Node.js
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version-file: package.json
          node-version: ${{ env.NODE_VERSION }}
          run-install: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        id: install
        run: |
          test "$(bun --version)" = "$BUN_VERSION"
          node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
          mkdir -p .local/ci
          vp install --frozen-lockfile 2>&1 | tee .local/ci/install.log

      - name: Check public documentation
        run: bun apps/desktop/scripts/check-public-docs.ts

      - name: Check formatting, lint, and types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          {
            bun run format:check && bun run lint &&
              bun run --cwd packages/orbits check-types && bun run typecheck
          } 2>&1 | tee .local/ci/check.log

      # Keep coverage and tests independently visible. A stale reviewed coverage
      # baseline must fail, not prevent the full unit suite from reporting.
      - name: Check OpenCode coverage baseline
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run opencode:coverage:check 2>&1 | tee .local/ci/coverage.log

      - name: Run all unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test 2>&1 | tee .local/ci/unit-tests.log

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build 2>&1 | tee .local/ci/build.log

      - name: Upload check failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-failure-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ci/*.log
            .local/opencode-coverage/report.json
            .local/opencode-coverage/report.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  smoke-e2e:
    name: Native smoke E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Vite+ and Node.js
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version-file: package.json
          node-version: ${{ env.NODE_VERSION }}
          run-install: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Prepare Linux native display and sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth dbus-x11 libgtk-3-0t64 libnss3 libasound2t64
          # Keep Electron's sandbox enabled rather than disabling Ubuntu's
          # AppArmor/user-namespace policy or passing --no-sandbox.
          # Download first: Electron's lazy installer writes to stdout, which
          # must not become part of the captured sandbox path.
          node -e 'require("electron")'
          sandbox="$(node -p 'require("node:path").join(require("node:path").dirname(require("electron")), "chrome-sandbox")')"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      - name: Install the aligned OpenCode CLI
        run: |
          version="$(bun -p 'require("./apps/desktop/package.json").devDependencies["@opencode/client"]')"
          bun add --global --trust "@opencode/cli@$version"

      - name: Run deterministic smoke scenario
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24 -nolisten tcp' bun run test:e2e -- smoke
          else
            bun run test:e2e -- smoke
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-e2e-failure-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Allowlist synthetic-run diagnostics, not isolated homes/auth/service data.
          path: |
            .local/desktop-e2e/**/instance.json
            .local/desktop-e2e/**/build.log
            .local/desktop-e2e/**/electron.log
            .local/desktop-e2e/**/service-startup-error.log
            .local/desktop-e2e/**/failure.png
            .local/desktop-e2e/**/llm-requests.json
            .local/desktop-e2e/**/logs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
