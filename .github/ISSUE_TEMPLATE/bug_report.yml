name: Bug report
description: Report a reproducible problem in Palot
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Palot. Do not include credentials, prompts, private source, repository paths, tokens, authorization headers, or unreviewed support artifacts.

        Report suspected vulnerabilities privately through [GitHub Security Advisories](https://github.com/ItsWendell/palot/security/advisories/new), not here.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is a Palot problem, not an OpenCode, provider, model, plugin, or MCP server problem.
          required: true
        - label: I removed sensitive and private information from this report.
          required: true

  - type: input
    id: palot-version
    attributes:
      label: Palot version or commit
      description: Use the commit SHA when running from source.
      placeholder: 0123456789abcdef or 0.1.0
    validations:
      required: true

  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      description: Run `opencode2 --version`.
      placeholder: 0.0.0-beta-18866
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: macOS version and architecture
      placeholder: macOS 15.6, Apple silicon
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start Palot with ...
        2. Open ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or visual evidence
      description: Paste only the smallest reviewed excerpt. Drag in screenshots or recordings when useful.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include frequency, regressions, workarounds, or anything else that narrows the problem.
