appId: dev.palot.desktop
productName: Palot
copyright: Copyright (c) 2026 Palot contributors

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - "!out/**/*.map"
  - "!node_modules/**/*.map"
  - package.json
  - node_modules/electron-liquid-glass/**/*
  - node_modules/node-gyp-build/**/*
  - node_modules/objc-js/**/*

extraResources:
  - from: ../../LICENSE
    to: licenses/LICENSE.palot.txt
  - from: resources/icons
    to: icons
    filter:
      - "**/icon.png"
      - "**/dock.png"
      - tray/**
  - from: drizzle
    to: drizzle
  - from: resources/licenses
    to: licenses
  - from: resources/opencode-policy.json
    to: opencode/policy.json

asar: true
asarUnpack:
  - node_modules/electron-liquid-glass/**/*
  - node_modules/node-gyp-build/**/*
  - node_modules/objc-js/**/*
npmRebuild: false
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
afterPack: scripts/after-pack.cjs
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true

mac:
  icon: resources/icons/stable/icon.icns
  identity: "-"
  minimumSystemVersion: "13.0"
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  icon: resources/icons/stable/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64

linux:
  icon: resources/icons/stable
  executableName: palot
  # Explicit maintainer avoids electron-builder requiring an invented author email.
  maintainer: Palot contributors
  # Keep electron-builder's per-executable AppArmor profile and install/remove hooks.
  # They allow user namespaces on Ubuntu 24+ without disabling Chromium's sandbox.
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Development
  desktop:
    entry:
      StartupWMClass: dev.palot.desktop
      Actions: NewTask;
      Keywords: "AI;Development;OpenCode;"
    desktopActions:
      NewTask:
        Name: New Task
        Exec: palot --new-task

rpm:
  fpm:
    - --rpm-auto-add-directories

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
