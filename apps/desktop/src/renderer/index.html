<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <title>Nexus Builder</title>
    <style>
      /* Splash screen styles -- inlined so they render before any JS loads. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* Transparent so macOS glass/vibrancy shows through. The native
           window chrome provides the visual backdrop. */
        background: transparent;
        transition: opacity 300ms ease-out;
        /* Allow dragging the window from the splash on macOS */
        -webkit-app-region: drag;
      }
      #splash.hiding {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        height: 20px;
        width: auto;
        color: hsl(var(--foreground, 0 0% 93%));
      }
      #splash .dots {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 24px;
      }
      #splash .dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: hsl(var(--muted-foreground, 0 0% 45%) / 0.4);
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      #splash .dots span:nth-child(2) { animation-delay: 150ms; }
      #splash .dots span:nth-child(3) { animation-delay: 300ms; }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <script>
      // Prevent flash of wrong color scheme before React hydrates.
      // Reads from the same localStorage key used by Zustand persist.
      try {
        var prefs = JSON.parse(localStorage.getItem('palot-preferences') || '{}');
        var state = prefs.state || {};
        var scheme = state.colorScheme || 'dark';
        var themeId = state.theme || 'default';
        var cls = scheme;
        if (scheme === 'system') {
          cls = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(cls);
        if (themeId !== 'default') {
          document.documentElement.classList.add('theme-' + themeId);
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <script>
      // React Scan: dev-only render visualizer. Loaded via script tag outside
      // Vite's module graph so it survives HMR. Uses document.write to ensure
      // the script loads synchronously before React's module script executes.
      // Toggle via Command Palette (Cmd+K > "React Scan"). Only active in dev
      // since production React builds don't expose the DevTools hook.
      try {
        if (localStorage.getItem('palot:reactScan') === 'true') {
          document.write('<script src="https://unpkg.com/react-scan/dist/auto.global.js"><\/script>');
        }
      } catch (e) {}
    </script>
    <!-- Splash screen: renders immediately before React/JS loads.
         The React StartupOverlay component removes this element once it mounts. -->
    <div id="splash">
      <svg viewBox="0 0 520 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="overflow:visible">
        <path d="M15 57V15h10l22 26V15h11v42H48L26 31v26H15Z" fill="currentColor" />
        <path d="M82 57V15h31v10H94v6h17v9H94v7h20v10H82Z" fill="currentColor" />
        <path d="M132 57l15-22-14-20h14l7 11 7-11h14l-14 20 15 22h-14l-8-12-8 12h-14Z" fill="currentColor" />
        <path d="M213 58c-12 0-20-7-20-19V15h12v23c0 6 3 10 8 10s8-4 8-10V15h12v24c0 12-8 19-20 19Z" fill="currentColor" />
        <path d="M273 58c-8 0-15-2-21-7l5-9c5 4 11 6 16 6 4 0 6-1 6-4 0-7-25-2-25-17 0-8 7-13 18-13 7 0 13 2 18 5l-5 9c-4-3-9-5-13-5s-6 1-6 4c0 6 25 2 25 17 0 9-7 14-18 14Z" fill="currentColor" />
        <path d="M319 57V15h22c9 0 15 5 15 12 0 4-2 8-6 10 5 2 8 6 8 12 0 8-7 13-17 13h-22ZM331 32h8c3 0 5-2 5-4s-2-4-5-4h-8v8ZM331 48h9c4 0 6-2 6-5s-2-5-6-5h-9v10Z" fill="currentColor" />
        <path d="M382 57V15h12v32h19v10h-31Z" fill="currentColor" />
        <path d="M434 57V15h12v42h-12Z" fill="currentColor" />
        <path d="M473 57V15h17c14 0 23 8 23 21s-9 21-23 21h-17ZM485 47h5c7 0 11-4 11-11s-4-11-11-11h-5v22Z" fill="currentColor" />
      </svg>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
